services:
  hidden-robotics-ros2:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: kai_hidden_robotics_ros2
    network_mode: host
    privileged: true
    volumes:
      - ..:/workspace:cached
      - /dev:/dev
    environment:
      - ROS_DOMAIN_ID=42
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
               ./test_omni_e2e.sh &&
               tail -f /dev/null"
               
