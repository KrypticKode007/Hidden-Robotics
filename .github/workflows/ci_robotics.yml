name: Hidden-Robotics CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python & PlatformIO dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyserial pyyaml platformio

      - name: Compile ESP32-S3 Actuator Firmware
        run: |
          if [ -f "firmware/platformio.ini" ]; then
            pio run -d firmware
          fi

      - name: Run E2E Safety & COBS Verification Suite
        run: |
          chmod +x test_omni_e2e.sh
          ./test_omni_e2e.sh
          
